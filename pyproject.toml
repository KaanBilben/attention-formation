[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "attention-formation"
version = "0.1.0"
description = "Attention tabanlı RL Agent'larının değişken N ile Daire Formasyonu kurması"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "ray[rllib]>=2.59",
    # CPU sürümü için: pip install torch --index-url https://download.pytorch.org/whl/cpu
    "torch",
    "pygame",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".agents", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
